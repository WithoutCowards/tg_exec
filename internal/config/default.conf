# tg-exec configuration
#
# Priority (low -> high): /etc/tg-exec/config.conf, ~/.config/tg-exec/config.conf,
# --config FILE, environment TG_EXEC_<KEY>, command-line flags.
# Quick start: tg-exec --setup        Check: tg-exec --check
# Keep this file private: chmod 600 (it may contain the bot token).

# --- Bot token: set ONE of TOKEN / TOKEN_FILE / TOKEN_CMD ----------------------
TOKEN=""                    # bot token from @BotFather
#TOKEN_FILE="/etc/tg-exec/token"     # file containing the token (chmod 600)
#TOKEN_CMD="systemd-creds decrypt --name=tg-exec-token /etc/tg-exec/token.cred -"
                            # command that prints the token (like aws credential_process):
                            # systemd-creds, vault kv get -field=token ..., pass show ...
                            # `tg-exec --seal` sets this up with systemd-creds.

# --- Where to send -----------------------------------------------------------
CHAT_ID=""                  # user id, group id (-100...), or @channel
#THREAD_ID=""               # forum topic id in a supergroup with topics
#NOTE="$(hostname)"         # label in the message; default: host name

# --- What to send ------------------------------------------------------------
#NOTIFY="always"            # always | failure  (failure = only report errors)
#OUTPUT="always"            # always | failure | never  (include command output)
#ATTACH="auto"              # auto | always | never  (full log as a .log file when it does not fit)
#SILENT_SUCCESS="0"         # 1 = successful runs arrive without sound
#LANG="auto"                # ru | en | auto (from the system locale)
#TIMEZONE=""                # e.g. Europe/Moscow; default: system time zone

# --- Command -----------------------------------------------------------------
#TIMEOUT=""                 # stop the command after 90s, 30m, 2h (exit code 124)
#SHELL=""                   # shell for "command line" mode; default: bash, then /bin/sh

# --- Network -----------------------------------------------------------------
#PROXY=""                   # http://, https://, socks5://, socks5h://user:pass@host:port, or none;
                            # empty = HTTPS_PROXY / ALL_PROXY / NO_PROXY from the environment
#API_URL="https://api.telegram.org"   # own Bot API server or reverse proxy (closed networks)
#CA_FILE=""                 # extra PEM CA bundle (TLS-inspecting proxy, internal Bot API)
#HTTP_TIMEOUT="15"          # seconds per request
#RETRIES="3"                # total attempts (429 retry_after is respected)
#BACKOFF="2"                # first pause between attempts, seconds (doubles)

# --- Behaviour ---------------------------------------------------------------
#STRICT="0"                 # 1 = exit 70 if the job succeeded but the message was not sent
#DEBUG="0"                  # 1 = diagnostics on stderr
