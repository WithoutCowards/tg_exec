# nfpm config: deb, rpm and apk from one file.
# VERSION and ARCH (amd64/arm64/arm7) come from scripts/dist.sh, which also
# copies the binary for the current arch to build/tg-exec.
name: tg-exec
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: RunStack <support@runstack.ru>
description: |
  Run a command and report the result to Telegram
  Exit code, duration, output tail and the full log as a file; proxy
  (HTTP/HTTPS/SOCKS5), own Bot API endpoint for closed networks, token from
  a file, a command or systemd-creds. Static binary, no dependencies.
vendor: RunStack
homepage: https://runstack.ru/p/tg-exec
license: CC-BY-NC-4.0

contents:
  - src: build/tg-exec
    dst: /usr/bin/tg-exec
    file_info:
      mode: 0755
  - src: internal/config/default.conf
    dst: /etc/tg-exec/config.conf
    type: config|noreplace
    file_info:
      mode: 0600
  - dst: /etc/tg-exec
    type: dir
    file_info:
      mode: 0755
  - src: build/tg-exec.1.gz
    dst: /usr/share/man/man1/tg-exec.1.gz
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/tg-exec/README.md
    file_info:
      mode: 0644
  - src: CHANGELOG.md
    dst: /usr/share/doc/tg-exec/CHANGELOG.md
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/tg-exec/LICENSE
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/postinstall.sh

overrides:
  deb:
    depends:
      - ca-certificates
  rpm:
    depends:
      - ca-certificates
  apk:
    depends:
      - ca-certificates
